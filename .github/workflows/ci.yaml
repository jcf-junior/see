name: Build Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Git Semantic Version
        id: semver
        uses: PaulHatch/semantic-version@v6.0.2

      - name: Garantir que a versão é nova
        env:
          VERSION: ${{ steps.semver.outputs.version_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "A versão ${VERSION} já existe. Faz um commit novo antes de voltar a compilar."
            exit 1
          fi
          echo "Nova versão: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build (${{ matrix.arch }})
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build \
            -ldflags "-X main.version=${{ needs.version.outputs.version }}" \
            -o see .

      - name: Build .deb (${{ matrix.arch }})
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          nfpm package --packager deb --target raw.deb
          dpkg-deb -R raw.deb pkg
          dpkg-deb --build --root-owner-group pkg "see_${ARCH}.deb"
          rm -rf pkg raw.deb

      - name: Test install
        if: matrix.arch == 'amd64'
        run: |
          sudo apt install -y "./see_amd64.deb"
          see -v

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}-${{ version.outputs.version }}
          path: "*.deb"

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download .deb packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true

      - name: Create git tag
        env:
          VERSION: ${{ needs.version.outputs.version_tag }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version_tag }}
          files: "*.deb"
